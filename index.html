<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA RADIO — фанатское радио из игр серии</title>
<meta name="description" content="Концепт-сайт: радиостанции из GTA V, IV, San Andreas, Vice City и GTA III. Круговой селектор станций, как в игре.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070b11'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%237fd4ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%237fd4ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <div class="home">
    <header class="home-head">
      <span class="brand">◉ GTA RADIO</span>
      <span><a href="editor.html">Редактор станций</a> · <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a></span>
    </header>

    <main class="title-wrap">
      <h1 class="title"><span class="l1">GTA</span><span class="l2">RADIO</span></h1>
      <p class="subtitle" id="subtitle">выбери игру — получи её эфир</p>
      <p class="hint">Наведи на игру → кликни → крути колесо станций. <kbd>←</kbd> <kbd>→</kbd> переключают волну, <kbd>Space</kbd> — пауза.</p>

      <section class="games">
        <div class="games-h"><span>Выбор игры</span></div>
        <div class="games-grid" id="games"></div>
      </section>
    </main>

    <footer class="footer">
      <p id="disclaimer"></p>
      <p>Прототип v<span id="ver"></span> · всё содержимое правится в <a href="editor.html">редакторе</a> или в <code>js/config.js</code></p>
    </footer>
  </div>

<script src="js/art.auto.js"></script>
<script src="js/config.js"></script>
<script>
(function () {
  const CFG = window.RADIO_CONFIG;
  const ART = window.RADIO_ART || { gameLogos: {} };
  if (ART.home) {
    const d = document.createElement('div');
    d.className = 'bgimg';
    d.style.backgroundImage = `url("${ART.home}")`;
    document.body.prepend(d);
    document.body.classList.add('has-bg');
  }
  const grid = document.getElementById('games');
  document.getElementById('subtitle').textContent = CFG.meta.subtitle;
  document.getElementById('disclaimer').textContent = CFG.meta.disclaimer;
  document.getElementById('ver').textContent = CFG.meta.version;

  CFG.games.forEach(g => {
    const a = document.createElement('a');
    a.className = 'game';
    a.href = 'radio.html?game=' + g.id;
    a.style.setProperty('--c', g.accent);
    const gl = (ART.gameLogos || {})[g.id];
    a.innerHTML = `
      <span class="g-arrow">→</span>
      ${gl ? `<img class="g-logo" src="${gl}" alt="${g.name}">` : `<span class="num">${g.num}</span>`}
      <span class="g-name">${g.name}</span>
      <span class="g-meta">${g.year} · ${g.city}</span>
      <span class="g-count">${g.stations.length} станций</span>`;
    a.addEventListener('mouseenter', () => document.body.style.setProperty('--accent', g.accent));
    a.addEventListener('focus', () => document.body.style.setProperty('--accent', g.accent));
    grid.appendChild(a);
  });
})();
</script>
</body>
</html>
